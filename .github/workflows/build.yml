name: Build Freeze Shimmer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure (binaire universel Intel + Apple Silicon)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Signature locale (ad-hoc) et nettoyage
        run: |
          VST3=$(find build -type d -name "*.vst3" | head -n 1)
          echo "Plugin trouvé : $VST3"
          xattr -cr "$VST3"
          codesign --force --deep --sign - "$VST3"
          codesign --verify --deep --strict "$VST3"
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$VST3" "dist/$(basename "$VST3" .vst3)-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: VST3-macOS
          path: dist/*.zip

  windows-vst3:
    name: VST3 Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "Freeze Shimmer.vst3" | Select-Object -First 1
          if (-not $vst3) { throw "Freeze Shimmer.vst3 introuvable" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item $vst3.FullName -Destination dist -Recurse
          Copy-Item scripts/Install-FreezeShimmer.ps1 -Destination dist
          $exe = Get-ChildItem -Path build -Recurse -Filter "Freeze Shimmer.exe" | Select-Object -First 1
          if ($exe) { Copy-Item $exe.FullName -Destination dist }
          Compress-Archive -Path dist/* -DestinationPath FreezeShimmer-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: FreezeShimmer-win64
          path: FreezeShimmer-win64.zip

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FreezeShimmer-win64.zip
